<!DOCTYPE html >
<html lang="{{ site.lang }}">

  {% include head.html %}

  <body>

    <!-- Page Loader -->
    <div id="page-loader" class="page-loader"><span class="load-icon"></span></div>

    {% include header-page.html %}

    <!-- Page Section -->
    <section class="site-section blog-section page-layout" id="start">
      <div class="container">

        <!-- Page Layout -->
        <div class="row">

          <!-- Sidebar -->
          <!-- <div class="col-md-4 hidden-xs hidden-sm"> -->

            {% comment %} include sidebar.html {% endcomment %}

          <!-- </div> -->

          <!-- Content -->
          <div class="col-md-12 blog-articles-container">
            <img src="{{ page.avatar_path }}" class="center-avatar" alt="Avatar">
            <br><br>
            {{ content }}

          </div>
        </div>
      </div>
    </section>

    {% include footer.html %}

    {% include scripts.html %}

  </body>

</html>
