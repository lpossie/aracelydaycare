testimonials-title: Testimonials
testimonials-description: There’s nothing more meaningful to us than the kind words and experiences shared by our daycare families. Their feedback is a true reflection of the love, care, and dedication we pour into every day. We’re proud to have earned the trust of our families—and their reviews speak volumes.

#
# Testimonials
#
testimonials:
  # Client
  - name: Angela Rivera
    url: https://www.google.com/search?sca_esv=8fe472cf0c0bad30&si=AMgyJEtREmoPL4P1I5IDCfuA8gybfVI2d5Uj7QMwYCZHKDZ-E4zumJJ6_Xv8lqyA6BsQ9sniMqsI3wmmzHl4oFjn2a5cYHfGoRLZVsjtnWI3f9zfS_ivg-Oddwtw2etirvIk2ec_ml0HWF6rT335OD9U5m3WV9QOxg%3D%3D&q=Aracely%27s+Daycare+Reviews&sa=X&ved=2ahUKEwiM04SosquOAxUnM0QIHfgyKq4Q0bkNegQIQRAE&biw=2544&bih=1246&dpr=1
    url-text: Google Reviews
    avatar: a.png
    cite: I have had nothing but an amazing interaction with Aracely! She is very understanding, kind, and professional. I have a set of Twins at the age of 1 and  they had a rough start to daycare. So did I. I was very emotional. But Aracely was kind enough to take the extra effort and  make sure I was updated  constantly everyday the first week we were adjusting to daycare since it was the first time ever. I was very iffy about having my kids in daycare at all but I was referred to Aracely from a friend that always spoke highly of her. And I am so glad this is where my kids are going. I have never been more comfortable with someone other than my own mother watching my twins.
    logo-img: google_logo.png

  # Client
  - name: S
    url: https://www.google.com/search?sca_esv=8fe472cf0c0bad30&si=AMgyJEtREmoPL4P1I5IDCfuA8gybfVI2d5Uj7QMwYCZHKDZ-E4zumJJ6_Xv8lqyA6BsQ9sniMqsI3wmmzHl4oFjn2a5cYHfGoRLZVsjtnWI3f9zfS_ivg-Oddwtw2etirvIk2ec_ml0HWF6rT335OD9U5m3WV9QOxg%3D%3D&q=Aracely%27s+Daycare+Reviews&sa=X&ved=2ahUKEwiM04SosquOAxUnM0QIHfgyKq4Q0bkNegQIQRAE&biw=2544&bih=1246&dpr=1
    url-text: Google Reviews
    avatar: s.png
    cite: My 4 year old twins have been with Aracely since they were two. She has provided a loving, structured environment that kids can grow and flourish in. I believe my children are better having spent time with her then just being raised by me. Aracely has been reliable and direct with the schedule and expectations. This is a place for parents who are looking for an excellent nurturing environment as a priority versus having 13 hours open a day like the big chain centers.
    logo-img: google_logo.png

  # Client
  - name: Emily Abegglen
    url: https://www.google.com/search?sca_esv=8fe472cf0c0bad30&si=AMgyJEtREmoPL4P1I5IDCfuA8gybfVI2d5Uj7QMwYCZHKDZ-E4zumJJ6_Xv8lqyA6BsQ9sniMqsI3wmmzHl4oFjn2a5cYHfGoRLZVsjtnWI3f9zfS_ivg-Oddwtw2etirvIk2ec_ml0HWF6rT335OD9U5m3WV9QOxg%3D%3D&q=Aracely%27s+Daycare+Reviews&sa=X&ved=2ahUKEwiM04SosquOAxUnM0QIHfgyKq4Q0bkNegQIQRAE&biw=2544&bih=1246&dpr=1
    url-text: Google Reviews
    avatar: e.png
    cite: I cannot recommend Aracely enough! My son is 6 months old and has been going to her since he was 3 months old and I knew that she was the only one I would trust with my infant as a first time mom. Her home is immaculately clean and a great environment for him to thrive in. She is always updating me on his progress and I know that she is truly invested in and loves each of the children in her care. He lights up the minute he sees her every morning!
    logo-img: google_logo.png

  # Client
  - name: Lindsey Ketcham
    url: https://www.google.com/search?sca_esv=8fe472cf0c0bad30&si=AMgyJEtREmoPL4P1I5IDCfuA8gybfVI2d5Uj7QMwYCZHKDZ-E4zumJJ6_Xv8lqyA6BsQ9sniMqsI3wmmzHl4oFjn2a5cYHfGoRLZVsjtnWI3f9zfS_ivg-Oddwtw2etirvIk2ec_ml0HWF6rT335OD9U5m3WV9QOxg%3D%3D&q=Aracely%27s+Daycare+Reviews&sa=X&ved=2ahUKEwiM04SosquOAxUnM0QIHfgyKq4Q0bkNegQIQRAE&biw=2544&bih=1246&dpr=1
    url-text: Google Reviews
    avatar: l.png
    cite: I highly recommend Aracely to anyone looking for childcare. Aracely is one in a million. Her home is meticulous, her curriculum is exceptional, her nutrition plan is perfect and her ability to love and care for these kids is unlike anything I have experienced. My two girls went to “Mama-Cely” from birth until Kindergarten and honestly learned the best parts of them from her. They were well fed, loved, nurtured, taught, well rested and felt right at home. I owe so much to Cely and I will never stop singing her praises.
    logo-img: google_logo.png

  # Client
  - name: ShayLee Nye
    url: https://www.google.com/search?sca_esv=8fe472cf0c0bad30&si=AMgyJEtREmoPL4P1I5IDCfuA8gybfVI2d5Uj7QMwYCZHKDZ-E4zumJJ6_Xv8lqyA6BsQ9sniMqsI3wmmzHl4oFjn2a5cYHfGoRLZVsjtnWI3f9zfS_ivg-Oddwtw2etirvIk2ec_ml0HWF6rT335OD9U5m3WV9QOxg%3D%3D&q=Aracely%27s+Daycare+Reviews&sa=X&ved=2ahUKEwiM04SosquOAxUnM0QIHfgyKq4Q0bkNegQIQRAE&biw=2544&bih=1246&dpr=1
    url-text: Google Reviews
    avatar: shaylee_nye.png
    cite: Our son has attended Aracely's Daycare since June, and we are just in love with the care Aracely has given to our sweet boy. Aracely and her Husband are the most kind, patient people I have ever met, we are very thankful to have them in our lives. Knowing that our son is safe, eating healthy meals, and getting a proper nap time is such a relief, not having to worry about that makes everything so much better! Thank you Arecely and Family!
    logo-img: google_logo.png
  # Client
  - name: Bryce Abegglen
    url: https://www.google.com/search?sca_esv=8fe472cf0c0bad30&si=AMgyJEtREmoPL4P1I5IDCfuA8gybfVI2d5Uj7QMwYCZHKDZ-E4zumJJ6_Xv8lqyA6BsQ9sniMqsI3wmmzHl4oFjn2a5cYHfGoRLZVsjtnWI3f9zfS_ivg-Oddwtw2etirvIk2ec_ml0HWF6rT335OD9U5m3WV9QOxg%3D%3D&q=Aracely%27s+Daycare+Reviews&sa=X&ved=2ahUKEwiM04SosquOAxUnM0QIHfgyKq4Q0bkNegQIQRAE&biw=2544&bih=1246&dpr=1
