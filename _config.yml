#####################################
#############   About   #############
#####################################
about-title: About Our Daycare
about-description: <p>Aracely's Day Care is a licensed childcare facility that provides a nurturing home environment and fosters the skills necessary for lifelong learning. Children learn through creative play, socialization and a developmentally appropriate curriculum. Aracely's Day Care is a home away from home where children feel safe and loved.</p><p>With over 30 years of professional experience and early childhood development training, Aracely Possié has a passion for working with young children and is an excellent childcare provider. Aracely believes that quality childcare involves not only meeting the basic needs of the child but also creating a safe, clean and happy environment where children can thrive socially, emotionally and academically. As a mother of 6 children (and grandmother to 17), Aracely founded her own childcare center to meet the needs of families who share these same values.</p>

#####################################
#############  Features  ############
#####################################
features-title: Our Kids
features-description: Aracely's Day Care serves children ages six weeks through preschool (4-5 years old). To better meet the needs of each individual child, there is a limited number of children accepted within each age group. Please call us at (801) 675-8552 for availability.

#
# Features
#
features:
    # Feature
  - title: Home Environment
    description: Children thrive in spaces that feel safe, familiar, and filled with care. Our daycare offers a warm, home-like environment where little ones feel comfortable and secure. The space is spotless, thoughtfully organized, and designed to reflect the cozy comforts of home.
    icon: pe-7s-home

     # Feature
  - title: Healthy Meals
    description: Nutritious home made meals are made for all children. The meals consist of a balanced diet of vegetables, fruits, breads, milk and cereals. All meals and diets are approved via Alliance for Children. Special diets can be accommodated for a child with allergies or requires special diet.
    icon: pe-7s-like

  # Feature
  - title: Customized Curriculum
    description: The curriculum is simple and nurturing—designed to support each child’s natural curiosity through play, exploration, and self-discovery. Daily activities encourage social skills, creativity, and confidence in a calm, caring environment where children feel safe to grow at their own pace.
    icon: pe-7s-study




